[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "LingBot_VA"
version = "0.1.0"
description = "LingBot-VA: A Pragmatic VA Foundation Model"
authors = [
    { name = "Robbyant Team", email = "fengchang.ll@antgroup.com" }
]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # "torch==2.2.0",
    # "torchvision==0.17.0",
    # "torchaudio==2.2.0",

    "torch==2.7.0",
    "torchvision==0.22.0",
    "torchaudio==2.7.0",

    "accelerate==1.1.1",
    "diffusers==0.36.0",
    "easydict",
    "ftfy",
    "matplotlib",
    "msgpack",
    "numpy<2",
    "opencv-python",
    # "tokenizers",
    # "tqdm",
    "transformers==4.55.2",
    "websockets",

    # "flash_attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.5.5/flash_attn-2.5.5+cu122torch2.2cxx11abiFALSE-cp311-cp311-linux_x86_64.whl",
    "flash_attn @ https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.7cxx11abiFALSE-cp311-cp311-linux_x86_64.whl",

    "lerobot==0.3.3",
    "scipy",
    "wandb",

    "zmq",
    "pyrealsense2",
    "pymodbus",

    "h5py",
    "imageio[ffmpeg]",
]

[[tool.uv.index]]
name = "pypi"
url = "https://mirrors.ustc.edu.cn/pypi/simple"
default = true
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu128"
explicit = true
[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
    "mypy",
    "huggingface-hub[cli]"
]

[project.urls]
homepage = "https://github.com/Robbyant"
documentation = "https://github.com/Robbyant"
repository = "https://github.com/Robbyant"
huggingface = "https://github.com/Robbyant"
modelscope = "https://github.com/Robbyant"
discord = "https://github.com/Robbyant"

[tool.setuptools]
packages = ["wan_va"]
